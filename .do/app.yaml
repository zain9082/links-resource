# ============================================================
# DigitalOcean App Platform — Links Resource
# Deploy: doctl apps create --spec .do/app.yaml
# Or paste this in: App → Settings → App Spec
# ============================================================

name: links-resource
region: lon

features:
  - buildpack-stack=ubuntu-22

services:
  - name: web
    github:
      repo: zain9082/links-resource
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm run build
    run_command: npm start
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 8080
    envs:
      - key: NODE_ENV
        value: production
      - key: NODE_MODULES_CACHE
        value: "false"
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: NEXT_PUBLIC_SITE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}
      - key: AUTH_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SEED_ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET

jobs:
  - name: db-push
    kind: PRE_DEPLOY
    github:
      repo: zain9082/links-resource
      branch: main
    run_command: npx prisma db push
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

databases:
  - name: db
    engine: PG
    version: "16"
    production: false
    cluster_name: links-resource-db

ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
